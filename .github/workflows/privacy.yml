name: Repository privacy

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  privacy:
    name: Privacy guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Inspect committed tree
        run: python3 scripts/privacy_guard.py --tree HEAD
